<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FaceGate — Local Facial Authentication</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <main class="shell">
    <header><span class="mark">FG</span><div><p class="eyebrow">LOCAL DEMO</p><h1>FaceGate</h1><p>Facial authentication with a blink liveness check.</p></div></header>
    <section class="card" id="auth-card">
      <div class="tabs"><button class="tab active" data-mode="login">Log in</button><button class="tab" data-mode="enroll">Enroll</button></div>
      <div class="camera"><video id="video" autoplay muted playsinline></video><canvas id="canvas" hidden></canvas><div class="guide"></div></div>
      <label for="username">Username</label>
      <input id="username" maxlength="32" autocomplete="username" placeholder="e.g. abhijeet_01">
      <p class="hint" id="instructions">Look straight at the camera with your eyes open.</p>
      <button class="primary" id="action">Start login</button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <section class="card dashboard" id="dashboard" hidden>
      <h2>Welcome, <span id="who"></span></h2><p>Your local facial-authentication session is active.</p><button id="logout">Log out</button>
    </section>
    <p class="privacy">Privacy: processing happens on this computer. Raw camera frames are not saved.</p>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
